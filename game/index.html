<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a121a; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }
  #game-canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; display: none; }
  .panel { background: rgba(8, 16, 24, 0.72); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(2px); }
  #objective { position: absolute; top: 14px; left: 14px; max-width: 340px; }
  #objective-title { font-weight: 700; font-size: 15px; color: #ffd23e; letter-spacing: 0.4px; }
  #objective-text { font-size: 13px; margin-top: 4px; line-height: 1.35; }
  #objective-hold { display: none; margin-top: 8px; height: 8px; background: rgba(255,255,255,0.18); border-radius: 4px; overflow: hidden; }
  #objective-hold-fill { height: 100%; width: 0%; background: #ffd23e; }
  #stats { position: absolute; top: 14px; right: 14px; text-align: right; }
  #money { font-size: 26px; font-weight: 800; color: #7ddf8a; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  #stars { font-size: 22px; letter-spacing: 2px; color: #ffd23e; margin-top: 2px; }
  #stars.hot { color: #ff5346; animation: blink 0.7s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }
  #messages { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); width: 560px; text-align: center; }
  .msg { background: rgba(8, 16, 24, 0.78); border-left: 3px solid #ffd23e; padding: 8px 12px; margin: 6px auto; border-radius: 6px; font-size: 14px; text-align: left; transition: opacity 0.6s; }
  .msg.fade { opacity: 0; }
  #health { position: absolute; left: 14px; bottom: 14px; width: 220px; }
  #health-label { font-size: 11px; letter-spacing: 1px; color: #cfe3ef; margin-bottom: 4px; }
  #health-bar { height: 12px; background: rgba(255,255,255,0.16); border-radius: 6px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #58c96b; }
  #health-fill.low { background: #ff5346; }
  #health-text { font-size: 12px; margin-top: 3px; }
  #speed { position: absolute; right: 14px; bottom: 208px; text-align: right; display: none; }
  #speed-value { font-size: 34px; font-weight: 800; line-height: 1; }
  #speed-unit { font-size: 12px; color: #cfe3ef; }
  #minimap { position: absolute; right: 14px; bottom: 14px; width: 180px; height: 180px; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 2px solid rgba(255,255,255,0.85); border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.8); }
  #hint { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); font-size: 15px; font-weight: 700; color: #ffd23e; text-shadow: 0 2px 4px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.2s; }
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4, 10, 16, 0.55); z-index: 10; }
  #menu-card { background: rgba(8, 18, 28, 0.94); border: 1px solid rgba(255, 210, 62, 0.4); border-radius: 14px; padding: 34px 44px; max-width: 560px; text-align: center; color: #fff; box-shadow: 0 12px 48px rgba(0,0,0,0.6); }
  #menu-title { font-size: 42px; font-weight: 900; letter-spacing: 3px; color: #ffd23e; margin: 0 0 10px; }
  #menu-body { font-size: 15px; line-height: 1.55; color: #d8e6ef; margin: 0 0 22px; }
  #menu-buttons button { display: block; width: 100%; margin: 8px 0; padding: 12px 18px; font-size: 16px; font-weight: 700; color: #08121c; background: #ffd23e; border: none; border-radius: 8px; cursor: pointer; }
  #menu-buttons button:hover { background: #ffe27a; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud">
  <div id="objective" class="panel">
    <div id="objective-title">Free roam</div>
    <div id="objective-text"></div>
    <div id="objective-hold"><div id="objective-hold-fill"></div></div>
  </div>
  <div id="stats" class="panel">
    <div id="money">$0</div>
    <div id="stars">☆☆☆☆☆</div>
  </div>
  <div id="messages"></div>
  <div id="health" class="panel">
    <div id="health-label">HEALTH</div>
    <div id="health-bar"><div id="health-fill"></div></div>
    <div id="health-text">100</div>
  </div>
  <div id="speed" class="panel"><span id="speed-value">0</span> <span id="speed-unit">km/h</span></div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="crosshair"></div>
  <div id="hint"></div>
</div>
<div id="menu">
  <div id="menu-card">
    <h1 id="menu-title">SOLMAR BAY</h1>
    <p id="menu-body"></p>
    <div id="menu-buttons"></div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
